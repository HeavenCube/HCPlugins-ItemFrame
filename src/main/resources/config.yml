item:
  name: "<gold><bold>Cadre lumineux invisible</bold></gold>"
  lore:
    - "<gray>Devient invisible lorsqu'il contient un objet.</gray>"
    - "<dark_gray>Visible et en surbrillance lorsqu'il est vide.</dark_gray>"

messages:
  no-permission: "<red>Vous n'avez pas la permission d'utiliser cette commande.</red>"
  usage: "<red>Syntaxe : <white>/hcplugins itemframe give <joueur> [quantité] [-silent|-s]</white><gray> ou </gray><white>/hcplugins itemframe reload</white></red>"
  player-not-found: "<red>Le joueur <white><player></white> est introuvable ou hors ligne.</red>"
  invalid-amount: "<red>La quantité <white><amount></white> doit être un nombre entier strictement positif.</red>"
  amount-too-large: "<red>La quantité maximale autorisée est de <white><amount></white> cadres.</red>"
  staff-confirmation: "<green>Vous avez donné <white><amount></white> cadre(s) lumineux invisible(s) à <white><player></white>.</green>"
  player-received: "<green>Vous avez reçu <white><amount></white> cadre(s) lumineux invisible(s).</green>"
  reload-success: "<green>La configuration de HCItemFrame a été rechargée.</green>"
  reload-failure: "<red>Impossible de recharger la configuration. Consultez la console pour le détail.</red>"
  customize-hint: "<gray>Astuce : <yellow>Shift + clic gauche</yellow> sur ce cadre pour le personnaliser.</gray>"
  customize-hint-cooldown-seconds: 3

dialog:
  title: "<gradient:#38BDF8:#A855F7><bold>Personnalisation du cadre</bold></gradient>"
  description: "<gray>Choisissez une variante et un contour RGB ou shader. Cliquez à nouveau sur le contour actif pour revenir au glow blanc natif.</gray>"
  normal-frame: "<sprite:'minecraft:items':item/item_frame> <#F8FAFC>Cadre normal"
  glow-frame: "<sprite:'minecraft:items':item/glow_item_frame> <#FDE047>Cadre lumineux"
  selected: "<#22C55E><b>✓</b> <u>Sélectionnée</u>"
  close: "<#F87171>Fermer"

## Chaque contour déclare exactement une couleur RGB statique ou un profil HCResourcePack.
## Un RGB égal à un carrier réservé est refusé afin d'éviter d'activer silencieusement un profil shader.
## Les identifiants historiques des colorants sont conservés dans le PDC des cadres déjà placés.
